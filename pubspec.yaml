name: rythem_app
description: "An ambient, milestone-driven learning operating system and curriculum orchestrator."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3
  google_fonts: ^6.2.1
  youtube_explode_dart: ^3.1.0
  http: ^1.2.1
  file_picker: ^12.3.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.4.3
  sqlite3: ^3.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/fonts/

hooks:
  user_defines:
    sqlite3:
      source:
        linux: system
        default: sqlite3
