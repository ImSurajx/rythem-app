name: Build and Release APK

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
      - 'models-v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Rename and prepare APK artifact
        run: |
          mkdir -p release_output
          cp build/app/outputs/flutter-apk/app-release.apk release_output/rythem.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rythem-apk
          path: release_output/rythem.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            APP_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
            TAG_NAME="v$APP_VERSION"
          fi
          echo "Target release tag: $TAG_NAME"

          PRERELEASE_FLAG=""
          if [[ "$TAG_NAME" == *"-"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          else
            PRERELEASE_FLAG="--latest"
          fi

          # If release exists, upload and overwrite the APK asset using --clobber
          # If release does not exist yet, create it with release notes
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "Release $TAG_NAME exists. Uploading and updating APK asset..."
            gh release upload "$TAG_NAME" release_output/rythem.apk --clobber
            gh release edit "$TAG_NAME" $PRERELEASE_FLAG --notes-file CHANGELOG.md
          else
            echo "Release $TAG_NAME does not exist. Creating new release..."
            gh release create "$TAG_NAME" release_output/rythem.apk \
              --title "Rythem $TAG_NAME" \
              $PRERELEASE_FLAG \
              --notes-file CHANGELOG.md
          fi

          # Also ensure models release exists and mirrors model manifest, weights, and APK
          MODELS_TAG="models-v$APP_VERSION"
          echo "Syncing assets to models release tag: $MODELS_TAG"
          if ! gh release view "$MODELS_TAG" > /dev/null 2>&1; then
            echo "Creating $MODELS_TAG release..."
            gh release create "$MODELS_TAG" \
              --title "Rythem On-Device AI Models ($MODELS_TAG)" \
              --notes "On-device Small Language Models (Qwen 2.5 0.5B & 1.5B GGUF) for Rythem $TAG_NAME."
          fi

          mkdir -p model_dist
          cp .github/model_manifest.json model_dist/
          if ! gh release view "$MODELS_TAG" | grep -q "qwen2.5-0.5b-instruct-q4_k_m.gguf"; then
            echo "Fetching GGUF weights from base models-v1.0.0..."
            gh release download "models-v1.0.0" -D model_dist -p "*.gguf" || true
          fi
          echo "Uploading assets to $MODELS_TAG..."
          gh release upload "$MODELS_TAG" model_dist/* release_output/rythem.apk --clobber || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}


