name: Build and Release APK

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Rename and prepare APK artifact
        run: |
          mkdir -p release_output
          cp build/app/outputs/flutter-apk/app-release.apk release_output/rythem.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rythem-apk
          path: release_output/rythem.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [ "$TAG_NAME" = "refs/heads/master" ] || [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "$GITHUB_REF" ]; then
            TAG_NAME="v1.0.0"
          fi
          echo "Publishing release for tag: $TAG_NAME"

          # Delete previous release and tag if it exists to allow clean re-release
          gh release delete "$TAG_NAME" --yes --cleanup-tag || true

          # Create release and upload APK
          gh release create "$TAG_NAME" release_output/rythem.apk \
            --title "Rythem $TAG_NAME" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

