name: Build and Release APK

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Rename and prepare APK artifact
        run: |
          mkdir -p release_output
          cp build/app/outputs/flutter-apk/app-release.apk release_output/rythem.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rythem-apk
          path: release_output/rythem.apk
          retention-days: 14

      - name: Clean up previous releases
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const releases = await github.rest.repos.listReleases({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              for (const r of releases.data) {
                console.log(`Deleting previous release: ${r.id} (${r.tag_name})`);
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: r.id,
                });
              }
            } catch (err) {
              console.log('Error cleaning up releases:', err);
            }

      - name: Create or Update Release
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0"
          name: "Rythem v1.0.0"
          draft: false
          prerelease: false
          files: release_output/rythem.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
