name: Build and Release APK

on:
  push:
    branches:
      - master
      - '1.0.0-stable'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Rename and prepare APK artifact
        run: |
          mkdir -p release_output
          cp build/app/outputs/flutter-apk/app-release.apk release_output/rythem.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rythem-apk
          path: release_output/rythem.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/1.0.0-stable' || startsWith(github.ref, 'refs/tags/v')
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            APP_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
            TAG_NAME="v$APP_VERSION"
          fi
          echo "Target release tag: $TAG_NAME"

          mkdir -p model_dist
          cp .github/model_manifest.json model_dist/
          if ! gh release view "$TAG_NAME" 2>/dev/null | grep -q "qwen2.5-0.5b-instruct-q4_k_m.gguf"; then
            echo "Fetching GGUF weights from existing releases..."
            gh release download "models-v1.0.1" -D model_dist -p "*.gguf" || \
            gh release download "models-v1.0.2-pre.1" -D model_dist -p "*.gguf" || \
            gh release download "models-v1.0.0" -D model_dist -p "*.gguf" || true
          fi

          # Create or update the single stable release
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "Release $TAG_NAME exists. Uploading and updating APK and model assets..."
            gh release upload "$TAG_NAME" release_output/rythem.apk model_dist/* --clobber || true
            gh release edit "$TAG_NAME" --latest --title "Release" --notes-file CHANGELOG.md
          else
            echo "Release $TAG_NAME does not exist. Creating new release..."
            gh release create "$TAG_NAME" release_output/rythem.apk model_dist/* \
              --title "Release" \
              --latest \
              --notes-file CHANGELOG.md
          fi

          # Clean up all old releases and tags, keeping ONLY $TAG_NAME
          echo "Cleaning up all old releases..."
          for rel_id in $(gh api repos/ImSurajx/rythem-app/releases --jq '.[] | select(.tag_name != "'"$TAG_NAME"'") | .id'); do
            echo "Deleting old release ID $rel_id..."
            gh api --method DELETE "repos/ImSurajx/rythem-app/releases/$rel_id" || true
          done

          echo "Cleaning up old remote tags..."
          for old_tag in $(gh api repos/ImSurajx/rythem-app/git/refs/tags --jq '.[].ref' | sed 's|refs/tags/||' | grep -v "^${TAG_NAME}$"); do
            echo "Deleting old tag $old_tag..."
            gh api --method DELETE "repos/ImSurajx/rythem-app/git/refs/tags/$old_tag" || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}


